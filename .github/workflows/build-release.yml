# Build the site for deployment

name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 23.x
        uses: actions/setup-node@v4
        with:
          node-version: 23.x

      - name: npm CI build
        run: |
          npm ci

      - name: Unit tests
        run: |
          npm run test:unit

      - name: npm build
        run: |
          npm run build
